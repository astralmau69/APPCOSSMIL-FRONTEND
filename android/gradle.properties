# Máquina Linux con 7.5 GB de RAM: no subir Xmx sin verificar memoria disponible (el daemon muere por OOM)
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Proyecto en NTFS (ntfs-3g/FUSE): limitar E/S paralela para evitar fallos aleatorios de borrado
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
# screen_protector (y otros plugins viejos) no fijan su JVM target: su código
# Kotlin compila contra el JDK de Gradle (21) y su Java contra el default de
# AGP (17), lo que Kotlin trata como error duro. No es nuestro código; se baja
# a warning (fix oficial de JetBrains) en vez de tocar el build de un paquete
# de pub cache que se sobrescribiría en el próximo `flutter pub get`.
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
