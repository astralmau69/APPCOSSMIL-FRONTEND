<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!--
    NOTA DE SEGURIDAD: la Content-Security-Policy y la capa de seguridad web
    (flutter_security.js) NO se ponen aquí a propósito. En debug `flutter run`
    usa eval/scripts inline y una CSP estricta deja la PANTALLA EN BLANCO.
    Se inyectan SOLO en el build de release vía `build_release.ps1`.
  -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="COSSMIL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>COSSMIL</title>
  <link rel="manifest" href="manifest.json">

  <!--
    pdf.js AUTOALOJADO (web/pdfjs/): el paquete `printing` lo necesita para
    previsualizar/imprimir PDFs en web y por defecto lo descarga de unpkg.com
    (imposible en la LAN sin internet). Se precarga aquí COMPLETO (script +
    workerSrc en init.js) para que `printing` detecte pdfjsLib listo y salte
    su propio cargador: su lectura de window.dartPdfJsBaseUrl tiene un bug de
    interop en printing 5.14.3 (TypeError String→Never) que rompía la vista
    previa. NO volver a usar dartPdfJsBaseUrl mientras siga esa versión.
    Ambos <script> llevan defer: se ejecutan en orden, sin bloquear el pintado.
  -->
  <script src="pdfjs/pdf.min.js" defer></script>
  <script src="pdfjs/init.js" defer></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
