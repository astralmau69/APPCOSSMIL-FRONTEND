<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=375, initial-scale=1.0">
    <title>Login</title>
</head>
<body style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color:#F3F4F6; width:375px; height:812px; display:flex; flex-direction:column; padding:24px; box-sizing:border-box;">

    <!-- Contenedor Centrado -->
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        
        <!-- Logo simulado -->
        <div style="width:120px; height:120px; background-color:#e2e8f0; border-radius:60px; display:flex; justify-content:center; align-items:center; box-shadow:0 15px 35px rgba(0,0,0,0.1); margin-bottom:48px;">
           <span style="font-size:48px">🛡️</span>
        </div>
        
        <!-- Textos principales -->
        <h2 style="margin:0; font-size:32px; font-weight:800; color:#0f172a; letter-spacing:-0.5px;">Iniciar Sesión</h2>
        <p style="font-size:14px; color:#64748b; font-weight:600; letter-spacing:1.5px; margin-top:8px; margin-bottom:40px;">INGRESA TUS DATOS</p>
        
        <!-- Formulario Cajas -->
        <div style="background-color:white; border-radius:20px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.03); overflow:hidden; margin-bottom:32px;">
            
            <div style="padding:20px; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; flex-direction:row;">
                <span style="font-size:20px; opacity:0.6; margin-right:16px;">👤</span>
                <div style="display:flex; flex-direction:row; justify-content:space-between; flex:1;">
                    <span style="color:#0f172a; font-weight:600; font-size:16px;">Matrícula</span>
                    <span style="color:#64748b; font-size:16px;">010325AQJ</span>
                </div>
            </div>
            
            <div style="padding:20px; display:flex; align-items:center; flex-direction:row;">
                <span style="font-size:20px; opacity:0.6; margin-right:16px;">🔒</span>
                <div style="display:flex; flex-direction:row; justify-content:space-between; flex:1;">
                    <span style="color:#0f172a; font-weight:600; font-size:16px;">Contraseña</span>
                    <span style="color:#64748b; font-size:16px;">••••••••</span>
                </div>
                <span style="font-size:16px; color:#cbd5e1; margin-left:12px;">👁️</span>
            </div>
        </div>
        
        <!-- Boton principal -->
        <div style="background-color:#0E5B85; color:white; width:100%; padding:20px; border-radius:20px; text-align:center; font-weight:700; font-size:18px; box-shadow:0 10px 25px rgba(14,91,133,0.3); display:flex; justify-content:center; align-items:center; box-sizing:border-box;">
            Ingresar
        </div>
        
        <!-- Enlace olvidó contraseña -->
        <div style="margin-top:32px; color:#0E5B85; font-size:15px; font-weight:600;">¿Olvidaste tu contraseña?</div>
        
    </div>
</body>
</html>
