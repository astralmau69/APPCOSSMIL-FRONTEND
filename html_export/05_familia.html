<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=375, initial-scale=1.0">
    <title>Mi Familia</title>
</head>
<body style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color:#F3F4F6; width:375px; height:812px; display:flex; flex-direction:column; box-sizing:border-box; overflow:hidden;">

    <!-- TOP HEADER -->
    <div style="background-color:white; padding:40px 24px 16px 24px; border-bottom:1px solid #e2e8f0; text-align:center;">
        <h2 style="margin:0; font-size:18px; color:#0f172a; font-weight:800; letter-spacing:1px;">MI GRUPO FAMILIAR</h2>
    </div>

    <!-- Contenido Scrollable -->
    <div style="padding:24px; flex:1; overflow-y:auto; display:flex; flex-direction:column;">
        
        <p style="margin:0 0 24px 0; font-size:15px; color:#64748b; font-weight:500; text-align:center;">
            Gestiona los asegurados y dependientes bajo tu matrícula
        </p>

        <!-- Titular Card -->
        <span style="font-size:12px; color:#94a3b8; font-weight:800; letter-spacing:1px; margin-bottom:12px;">TITULAR DEL SEGURO</span>
        <div style="background-color:white; border-radius:24px; padding:20px; box-shadow:0 10px 25px rgba(0,0,0,0.05); margin-bottom:32px; border-left:6px solid #0E5B85;">
            <div style="display:flex; align-items:center; gap:16px;">
                <div style="width:56px; height:56px; background-color:#e0f2fe; border-radius:28px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; color:#0E5B85;">
                    A
                </div>
                <div style="display:flex; flex-direction:column; gap:6px;">
                    <span style="font-weight:800; font-size:18px; color:#0f172a;">ALDO JAIME</span>
                    <span style="font-size:13px; color:#64748b; font-weight:600;">Padre / Titular</span>
                </div>
            </div>
        </div>

        <!-- Dependientes -->
        <span style="font-size:12px; color:#94a3b8; font-weight:800; letter-spacing:1px; margin-bottom:12px;">BENEFICIARIOS (DEPENDIENTES)</span>
        
        <!-- Beneficiario 1 -->
        <div style="background-color:white; border-radius:24px; padding:20px; box-shadow:0 5px 15px rgba(0,0,0,0.03); margin-bottom:16px; border-left:6px solid #8B5CF6;">
            <div style="display:flex; align-items:center; gap:16px;">
                <div style="width:50px; height:50px; background-color:#ede9fe; border-radius:25px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:#8B5CF6;">
                    M
                </div>
                <div style="display:flex; flex-direction:column; gap:4px; flex:1;">
                    <span style="font-weight:700; font-size:16px; color:#0f172a;">MARIA ANTONIETA</span>
                    <span style="font-size:13px; color:#64748b; font-weight:500;">Esposa (Beneficiaria)</span>
                </div>
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <span style="font-size:18px;">🎂</span>
                    <span style="font-size:11px; font-weight:700; color:#94a3b8; margin-top:2px;">38 años</span>
                </div>
            </div>
        </div>

        <!-- Beneficiario 2 -->
        <div style="background-color:white; border-radius:24px; padding:20px; box-shadow:0 5px 15px rgba(0,0,0,0.03); margin-bottom:16px; border-left:6px solid #10B981;">
            <div style="display:flex; align-items:center; gap:16px;">
                <div style="width:50px; height:50px; background-color:#d1fae5; border-radius:25px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; color:#10B981;">
                    J
                </div>
                <div style="display:flex; flex-direction:column; gap:4px; flex:1;">
                    <span style="font-weight:700; font-size:16px; color:#0f172a;">JUAN CARLOS</span>
                    <span style="font-size:13px; color:#64748b; font-weight:500;">Hijo (Beneficiario)</span>
                </div>
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <span style="font-size:18px;">🎂</span>
                    <span style="font-size:11px; font-weight:700; color:#94a3b8; margin-top:2px;">12 años</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div style="height:80px; background-color:white; border-top:1px solid #e2e8f0; display:flex; justify-content:space-around; align-items:center; padding-bottom:15px; padding-top:10px; box-sizing:border-box;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px; opacity:0.4;">
            <span style="font-size:24px;">🏠</span>
            <span style="font-size:10px; font-weight:600;">Inicio</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px; opacity:0.4;">
            <span style="font-size:24px;">🕒</span>
            <span style="font-size:10px; font-weight:600;">Reservas</span>
        </div>
        <!-- FAB Central -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:0px;">
            <div style="width:56px; height:56px; background-color:#0E5B85; opacity:0.6; border-radius:28px; display:flex; justify-content:center; align-items:center; margin-top:-25px;">
                <span style="color:white; font-size:24px;">📅</span>
            </div>
            <span style="font-size:10px; font-weight:600; color:#64748b; margin-top:6px;">Reservar</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px; opacity:1.0;">
            <span style="font-size:24px; color:#0E5B85;">👥</span>
            <span style="font-size:10px; font-weight:800; color:#0E5B85;">Familia</span>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:4px; opacity:0.4;">
            <span style="font-size:24px;">👤</span>
            <span style="font-size:10px; font-weight:600;">Perfil</span>
        </div>
    </div>
</body>
</html>
