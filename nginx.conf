server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web es un SPA: cualquier ruta no encontrada cae a index.html.
    #
    # "no-cache" en TODO el estático (no solo index.html): Flutter web no
    # versiona sus archivos (main.dart.js, flutter_bootstrap.js, assets/...
    # conservan siempre el mismo nombre), así que sin esta cabecera el
    # navegador les aplica caché heurística y sigue mostrando builds viejos
    # aunque el contenedor ya sirva uno nuevo. "no-cache" NO prohíbe guardar:
    # obliga a revalidar con ETag y nginx responde 304 si no cambió, así que
    # las cargas repetidas siguen siendo baratas incluso para canvaskit.wasm.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    # Proxy hacia el backend real. El navegador solo ve este mismo origen
    # (localhost:8080), por lo que nunca dispara una petición cross-origin
    # y CORS deja de ser un problema. La resolución del backend se hace en
    # tiempo de ejecución (resolver + variable) para no cachear su IP para
    # siempre dentro del contenedor.
    location /api/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $cossmil_backend https://api.cossmil.mil.bo;

        proxy_ssl_server_name on;
        proxy_set_header Host api.cossmil.mil.bo;
        # Reenviar la credencial del cliente (Basic en el login) y el token
        # (Bearer en las llamadas protegidas). Sin esto el backend responde
        # 401 "Full authentication is required" y el login falla.
        proxy_set_header Authorization $http_authorization;
        # El backend rechaza (403) peticiones con un Origin que no reconoce,
        # así que no reenviamos el Origin del navegador.
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # IMPORTANTE: proxy_pass con variable ($cossmil_backend) NO debe llevar
        # URI. Si se pone "$cossmil_backend/api/", nginx trunca la ruta a "/api/"
        # y pierde "security/oauth/token", etc. -> el backend recibe todas las
        # llamadas en "/api/" pelado y responde 401. Sin URI, nginx reenvía la
        # ruta original completa ("/api/security/oauth/token?...").
        proxy_pass $cossmil_backend;
    }
}
